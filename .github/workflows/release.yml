name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish a release for
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Write release notes
        run: bash .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$TAG"
          --verify-tag
          --title "$TAG"
          --notes-file "$RUNNER_TEMP/notes.md"
          --generate-notes
